name: POMP NET deployment validation

on:
  push:
    branches: [main, pompnet-xray-core-native, siderail-pompnet-staging]
  pull_request:
    branches: [main, pompnet-xray-core-native, siderail-pompnet-staging]
  push:
    branches: [siderail-pompnet-staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell scripts
        run: |
          bash -n start.sh

      - name: Reject fake subscription configs
        run: |
          if grep -Eq 'vless://demo@|trojan://demo@|st\.ping[[:space:]]*=[[:space:]]*74|DEMO[[:space:]]*=[[:space:]]*true' sub.html; then
            echo "Fake/demo VPN subscription data must never ship."
            exit 1
          fi
          grep -q 'اطلاعات اشتراک در دسترس نیست' sub.html

      - name: Validate POMP NET SideRail integration routes
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("pompnet-dashboard.html").read_text(encoding="utf-8")
          api = Path("jinx_api.py").read_text(encoding="utf-8")
          nginx = Path("nginx.conf").read_text(encoding="utf-8")
          assert 'data-page="siderail"' in html and 'id="page-siderail"' in html
          assert 'loadSideRail()' in html and '/jinx-api/siderail' in html
          assert 'def subscription(self, path' in api and 'siderail_base()' in api
          assert 'location ^~ /sub/' in nginx and 'proxy_pass http://127.0.0.1:8090;' in nginx
          print("SideRail dashboard, API bridge and legacy subscription gateway routes are present.")
          PY

      - name: Validate Python syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          files = [
              Path("lock.py"),
              Path("ensure_admin.py"),
              Path("enforce_hosts.py"),
              Path("doctor.py"),
              Path("jinx_api.py"),
              Path("pompnet_telegram_bot.py"),
          ]
          for path in files:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              print(f"PYTHON OK: {path}")
          PY

      - name: Validate Xray and locked inbound JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          base = json.loads(Path("xray_config.json").read_text(encoding="utf-8"))
          locked = json.loads(Path("locked_inbound.json").read_text(encoding="utf-8"))
          assert isinstance(base.get("inbounds"), list) and base["inbounds"], "No base Xray inbounds"
          assert locked.get("protocol") == "vless", "Locked inbound must be VLESS"
          assert locked.get("port") == 2004, "Unexpected locked inbound port"
          assert locked.get("listen") == "127.0.0.1", "Locked inbound must not bind publicly"
          tags, ports = set(), set()
          for inbound in [locked, *base["inbounds"]]:
              assert inbound.get("tag") and inbound.get("port"), "Inbound missing tag/port"
              assert inbound["tag"] not in tags, f"Duplicate inbound tag: {inbound['tag']}"
              assert inbound["port"] not in ports, f"Duplicate inbound port: {inbound['port']}"
              tags.add(inbound["tag"])
              ports.add(inbound["port"])
          print(f"Xray JSON OK: {len(tags)} base + locked inbound definitions")
          PY

      - name: Build the actual Railway Docker image
        run: docker build --pull --tag pompnet-mohammad:ci .

      # Start the exact image as Railway will, then exercise the public HTTP routes.
      # This catches startup, Nginx, Marzban and Xray failures before a deploy is considered green.
      - name: Runtime smoke test (panel + Xray)
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run -d --name pompnet-smoke -e ADMIN_PASSWORD=CI-only-test-password -e POMPNET_3XUI_BRIDGE=0 -p 18080:8080 pompnet-mohammad:ci
          cleanup() { docker logs pompnet-smoke || true; docker rm -f pompnet-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          ready=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18080/health >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "Panel did not become healthy within 180 seconds"
            exit 1
          fi

          # Dashboard must be served, and the admin token route must reach the real API
          # (422 for an empty form is acceptable; 404/502 means routing is broken).
          dashboard_code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/dashboard/)
          [ "$dashboard_code" = "200" ] || { echo "Dashboard returned HTTP $dashboard_code"; exit 1; }
          owner_dashboard_code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/pompnet/)
          [ "$owner_dashboard_code" = "200" ] || { echo "POMP NET dashboard returned HTTP $owner_dashboard_code"; exit 1; }
          curl -fsS http://127.0.0.1:18080/pompnet/ | grep -q 'مدیریت واقعی SideRail' || { echo "SideRail page missing from POMP NET dashboard"; exit 1; }
          bridge_code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/jinx-api/siderail/status)
          [ "$bridge_code" = "401" ] || { echo "SideRail bridge route returned unexpected HTTP $bridge_code (expected auth challenge)"; exit 1; }
          legacy_sub_code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/sub/invalid-legacy-token)
          [ "$legacy_sub_code" = "404" ] || { echo "Legacy subscription fallback returned HTTP $legacy_sub_code (expected 404 for nonexistent token)"; exit 1; }

          token_code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18080/api/admin/token)
          case "$token_code" in 400|401|422) ;; *) echo "Admin API route returned unexpected HTTP $token_code"; exit 1 ;; esac

          # Wait for Xray to start, then verify actual WebSocket upgrades through Nginx
          # to all three generated protocol listeners (not just that the process exists).
          docker exec -i pompnet-smoke python - <<'PY'
          import json, os, socket, time
          cfg = json.load(open("/var/lib/marzban/xray_config.json", encoding="utf-8"))
          inbounds = {x.get("tag"): x for x in cfg.get("inbounds", [])}
          assert {"VLESS WS", "VMESS WS", "TROJAN WS"}.issubset(inbounds), "Missing WS protocol inbounds"
          base = "/cdn/" + open("/var/lib/marzban/jinx_path").read().strip()
          checks = [( "VLESS WS", base + "/v"), ("VMESS WS", base + "/m"), ("TROJAN WS", base + "/t")]
          for tag, path in checks:
              ib = inbounds[tag]
              assert ib.get("listen") == "127.0.0.1", f"{tag} must bind localhost behind Nginx"
              assert ib.get("port") in (2001, 2002, 2003), f"{tag} unexpected port"
              expected = ("/v", "/m", "/t")[checks.index((tag, path))]
              assert (ib.get("streamSettings") or {}).get("wsSettings", {}).get("path") == base + expected, f"{tag} path mismatch"
          def handshake(path):
              s = socket.create_connection(("127.0.0.1", 8080), timeout=5)
              req = (f"GET {path} HTTP/1.1\r\nHost: 127.0.0.1\r\nUpgrade: websocket\r\n"
                     "Connection: Upgrade\r\nSec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==\r\n"
                     "Sec-WebSocket-Version: 13\r\n\r\n").encode()
              s.sendall(req)
              data = s.recv(256)
              s.close()
              return data.split(b"\r\n", 1)[0]
          deadline = time.time() + 120
          while time.time() < deadline:
              try:
                  if all(handshake(path).startswith(b"HTTP/1.1 101") for _, path in checks):
                      print("PASS: VLESS, VMess and Trojan WebSocket upgrades return HTTP 101 through Nginx")
                      break
              except OSError:
                  pass
              time.sleep(2)
          else:
              raise SystemExit("FAIL: Xray WebSocket handshake did not return HTTP 101 for all protocols")
          print("Runtime Xray inbounds:", len(cfg["inbounds"]))
          PY
          echo "Runtime smoke test passed: panel, API routing and all three Xray WS handshakes are up."
