name: POMP NET deployment validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate selected production image configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          d = Path("Dockerfile").read_text(encoding="utf-8")
          assert "icubaby/SideRail.git" in d
          assert "6d794ce2303a01ecc412941a4f38fd00a3bda65b" in d
          assert "patch_brand.py" not in d and "patch_i18n.py" not in d
          assert "upstream/LICENSE ./LICENSE" in d
          assert "upstream/NOTICE ./NOTICE" in d
          print("PASS: official pinned SideRail build selected.")
          PY

      - name: Build official SideRail production image
        run: docker build --pull --tag pompnet-super-jinx:ci .

      - name: Verify original UI, backend and license artifacts
        run: |
          docker run --rm --entrypoint sh pompnet-super-jinx:ci -c '
            test -s /app/apps/server/dist/index.js &&
            test -s /app/public/index.html &&
            test -s /app/LICENSE &&
            test -s /app/NOTICE
          '
          echo "PASS: image contains the upstream SideRail server, original SPA, LICENSE and NOTICE."
