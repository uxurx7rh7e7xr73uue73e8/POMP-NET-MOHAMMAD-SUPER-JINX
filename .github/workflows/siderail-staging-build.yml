name: SideRail isolated staging image

on:
  pull_request:
    paths:
      - "siderail/**"
      - "vendor/SideRail"
      - "migration/marzban_to_siderail_backup.py"
      - "migration/test_marzban_to_siderail_backup.py"
      - "jinx_api.py"
      - "pompnet-dashboard.html"
      - "nginx.conf"
      - ".github/workflows/siderail-staging-build.yml"
  push:
    branches:
      - siderail-pompnet-staging
    paths:
      - "siderail/**"
      - "vendor/SideRail"
      - "jinx_api.py"
      - "pompnet-dashboard.html"
      - "nginx.conf"
      - ".github/workflows/siderail-staging-build.yml"

permissions:
  contents: read

jobs:
  build-side-rail:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout POMP NET source
        uses: actions/checkout@v4
      - name: Compile Python bridge and migration tools
        run: python3 -m py_compile jinx_api.py migration/marzban_to_siderail_backup.py migration/export_marzban_users.py
      - name: Run migration converter safety tests
        run: python3 -m unittest migration/test_marzban_to_siderail_backup.py -v
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build isolated SideRail image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: siderail/Dockerfile
          push: false
          load: true
          tags: pompnet-siderail-staging:test
      - name: SideRail runtime and real Xray WebSocket handshake
        shell: bash
        run: |
          set -Eeuo pipefail
          docker volume create siderail-smoke-data >/dev/null
          docker run -d --name siderail-smoke \
            -e NODE_ENV=production -e PORT=8080 \
            -e SIDERAIL_DATA_DIR=/data -e CORE_DIR=/data/core \
            -e CORE_VERSION=v26.9.9 -e CORE_API_PORT=10085 -e CORE_INBOUND_BASE_PORT=20000 \
            -e JWT_SECRET=ci-only-not-for-production-$(openssl rand -hex 32) \
            -v siderail-smoke-data:/data \
            -p 18081:8080 pompnet-siderail-staging:test
          cleanup() { docker logs siderail-smoke || true; docker rm -f siderail-smoke >/dev/null 2>&1 || true; docker volume rm siderail-smoke-data >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ready=0
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:18081/healthz >/dev/null; then ready=1; break; fi
            sleep 2
          done
          [ "$ready" = "1" ] || { echo "SideRail /healthz did not become ready"; exit 1; }
          curl -fsS http://127.0.0.1:18081/api/status
          docker exec siderail-smoke /data/core/xray run -test -config /data/core/config.json
          handshake=0
          for i in $(seq 1 60); do
            if docker exec siderail-smoke node -e 'const fs=require("fs"),net=require("net");const c=JSON.parse(fs.readFileSync("/data/core/config.json","utf8"));const tags=["VLESS-WS","VMess-WS","Trojan-WS"];let ix=0;function next(){if(ix===tags.length){console.log("PASS: all three real SideRail Xray WS inbounds returned HTTP 101");process.exit(0)}const b=c.inbounds.find(x=>x.tag===tags[ix++]);if(!b)process.exit(2);const p=b.streamSettings.wsSettings.path;const s=net.createConnection({host:"127.0.0.1",port:b.port},()=>s.write("GET "+p+" HTTP/1.1\r\nHost: localhost\r\nUpgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==\r\nSec-WebSocket-Version: 13\r\n\r\n"));let d="";s.setTimeout(4000,()=>process.exit(3));s.on("data",x=>{d+=x.toString();if(d.includes("\r\n\r\n")){s.destroy();if(!d.startsWith("HTTP/1.1 101")){console.error(tags[ix-1],d.slice(0,100));process.exit(4)}next()}});s.on("error",()=>process.exit(5))}next()'; then handshake=1; break; fi
            sleep 2
          done
          [ "$handshake" = "1" ] || { echo "SideRail Xray WebSocket handshake failed"; exit 1; }
          echo "PASS: SideRail server, persistent /data volume, Xray config validation and real local client WebSocket handshakes."
