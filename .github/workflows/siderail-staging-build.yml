name: SideRail isolated staging image

on:
  pull_request:
    paths:
      - "siderail/**"
      - "vendor/SideRail"
      - "migration/marzban_to_siderail_backup.py"
      - "migration/test_marzban_to_siderail_backup.py"
      - "jinx_api.py"
      - ".github/workflows/siderail-staging-build.yml"
  push:
    branches:
      - siderail-pompnet-staging
    paths:
      - "siderail/**"
      - "vendor/SideRail"
      - ".github/workflows/siderail-staging-build.yml"

permissions:
  contents: read

jobs:
  build-side-rail:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout POMP NET source
        uses: actions/checkout@v4
      - name: Compile Python bridge and migration tools
        run: python3 -m py_compile jinx_api.py migration/marzban_to_siderail_backup.py migration/export_marzban_users.py
      - name: Run migration converter safety tests
        run: python3 -m unittest migration/test_marzban_to_siderail_backup.py -v
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build isolated SideRail image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: siderail/Dockerfile
          push: false
          tags: pompnet-siderail-staging:test
