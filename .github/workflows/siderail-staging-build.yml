name: SideRail isolated staging image

on:
  workflow_dispatch:
  push:
    branches: ["siderail-pompnet-staging"]
    paths:
      - "siderail/**"
      - "vendor/SideRail"
      - "migration/marzban_to_siderail_backup.py"
      - "migration/test_marzban_to_siderail_backup.py"
      - "jinx_api.py"
      - "pompnet-dashboard.html"
      - "nginx.conf"
      - ".github/workflows/siderail-staging-build.yml"
  pull_request:
    paths:
      - "siderail/**"
      - "vendor/SideRail"
      - "migration/marzban_to_siderail_backup.py"
      - "migration/test_marzban_to_siderail_backup.py"
      - "jinx_api.py"
      - "pompnet-dashboard.html"
      - "nginx.conf"
      - ".github/workflows/siderail-staging-build.yml"
concurrency:
  group: siderail-staging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-side-rail:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout POMP NET source
        uses: actions/checkout@v4
      - name: Compile Python bridge and migration tools
        run: python3 -m py_compile jinx_api.py migration/marzban_to_siderail_backup.py migration/export_marzban_users.py
      - name: Run migration converter safety tests
        run: python3 -m unittest migration/test_marzban_to_siderail_backup.py -v
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build isolated SideRail image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: siderail/Dockerfile
          push: false
          load: true
          tags: pompnet-siderail-staging:test
      - name: SideRail runtime and real Xray WebSocket handshake
        shell: bash
        run: |
          set -Eeuo pipefail
          docker volume create siderail-smoke-data >/dev/null
          docker run -d --name siderail-smoke \
            -e NODE_ENV=production -e PORT=8080 \
            -e SIDERAIL_DATA_DIR=/data -e CORE_DIR=/data/core \
            -e CORE_VERSION=v26.9.9 -e CORE_API_PORT=10085 -e CORE_INBOUND_BASE_PORT=20000 \
            -e JWT_SECRET=ci-only-not-for-production-$(openssl rand -hex 48) \
            -v siderail-smoke-data:/data \
            -p 18081:8080 pompnet-siderail-staging:test
          cleanup() { docker logs siderail-smoke || true; docker rm -f siderail-smoke >/dev/null 2>&1 || true; docker volume rm siderail-smoke-data >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ready=0
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:18081/healthz >/dev/null; then ready=1; break; fi
            sleep 2
          done
          [ "$ready" = "1" ] || { echo "SideRail /healthz did not become ready"; exit 1; }
          # SideRail is a private API/core service; POMP NET owns login/dashboard/sub UI.
          docker exec siderail-smoke sh -c 'test ! -d /app/public && test ! -d /app/apps/web/dist'
          root_code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18081/)
          [ "$root_code" = "404" ] || { echo "SideRail web UI unexpectedly exposed at / (HTTP $root_code)"; exit 1; }
          wait_xray_listener() {
            for i in $(seq 1 120); do
              if docker exec siderail-smoke node -e 'const net=require("net"),s=net.createConnection({host:"127.0.0.1",port:20000},()=>{s.end();process.exit(0)});s.setTimeout(1000,()=>process.exit(1));s.on("error",()=>process.exit(1))'; then return 0; fi
              sleep 2
            done
            return 1
          }
          wait_xray_listener || { docker logs siderail-smoke; echo "SideRail Xray listener did not start"; exit 1; }
          curl -fsS http://127.0.0.1:18081/api/status
          setup_json=$(curl -fsS -X POST http://127.0.0.1:18081/api/setup -H 'Content-Type: application/json' -d '{"username":"ci-owner","password":"CI-only-strong-password"}')
          sr_token=$(printf '%s' "$setup_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          curl -fsS -X POST http://127.0.0.1:18081/api/users -H "Authorization: Bearer $sr_token" -H 'Content-Type: application/json' -d '{"email":"ci-xray-smoke@example.test","dataLimit":1,"expireDays":0,"inboundIds":[1]}'
          sleep 3
          wait_xray_listener || { docker logs siderail-smoke; echo "SideRail Xray listener did not recover after user creation"; exit 1; }
          docker exec siderail-smoke /data/core/xray run -test -config /data/core/config.json
          docker exec siderail-smoke node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync("/data/core/config.json","utf8"));const v=c.inbounds.find(x=>x.tag==="VLESS-WS");if(!v||!v.settings.clients.some(x=>x.email==="ci-xray-smoke@example.test"))process.exit(1);console.log("PASS: SideRail API-created user is present in the real Xray runtime config")'
          test_uuid=$(docker exec siderail-smoke node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync("/data/core/config.json","utf8"));const v=c.inbounds.find(x=>x.tag==="VLESS-WS");console.log(v.settings.clients.find(x=>x.email==="ci-xray-smoke@example.test").id)')
          test_path=$(docker exec siderail-smoke node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync("/data/core/config.json","utf8"));console.log(c.inbounds.find(x=>x.tag==="VLESS-WS").streamSettings.wsSettings.path)')
          # Use the container's routable eth0 address instead of loopback. Xray's freedom
          # outbound must exercise a normal TCP route, not a special 127/8 destination.
          test_target_ip=$(docker exec siderail-smoke node -e 'const os=require("os");const a=Object.values(os.networkInterfaces()).flat().find(x=>x&&x.family==="IPv4"&&!x.internal);if(!a)process.exit(2);process.stdout.write(a.address)')
          docker exec -d siderail-smoke node -e 'const fs=require("fs"),net=require("net");net.createServer(s=>{s.on("data",d=>{fs.appendFileSync("/tmp/echo.log","ECHO_REQUEST "+d.toString("hex")+"\\n");s.end("POMP NET VLESS E2E OK",()=>fs.appendFileSync("/tmp/echo.log","ECHO_RESPONSE_SENT\\n"))})}).listen(18090,"0.0.0.0")'
          docker exec -e TEST_TARGET_IP="$test_target_ip" siderail-smoke node -e 'const net=require("net");const s=net.connect(18090,process.env.TEST_TARGET_IP,()=>s.write("PING"));let b="";s.on("data",d=>{b+=d.toString();if(b.includes("POMP NET VLESS E2E OK")){console.log("PASS: direct TCP echo endpoint responds on container eth0 address");s.end()}});s.setTimeout(4000,()=>process.exit(2));s.on("error",e=>{console.error(e);process.exit(2)})'
          # Baseline: verify the same Xray SOCKS5 client and response parser with direct outbound.
          docker exec siderail-smoke node -e 'const fs=require("fs");const c={log:{loglevel:"warning"},inbounds:[{listen:"127.0.0.1",port:10809,protocol:"socks",settings:{auth:"noauth",udp:false}}],outbounds:[{protocol:"freedom",settings:{}}]};fs.writeFileSync("/tmp/direct-client.json",JSON.stringify(c))'
          docker exec -d siderail-smoke sh -c '/data/core/xray run -config /tmp/direct-client.json >/tmp/direct-client.log 2>&1'
          sleep 2
          docker exec -e TEST_TARGET_IP="$test_target_ip" siderail-smoke node -e 'const net=require("net");const ip=process.env.TEST_TARGET_IP.split(".").map(Number),p=Buffer.alloc(2);p.writeUInt16BE(18090);const s=net.connect(10809,"127.0.0.1");let stage=0,b=Buffer.alloc(0),body="";const fail=e=>{console.error(e);process.exit(3)};s.on("connect",()=>s.write(Buffer.from([5,1,0])));s.on("data",d=>{if(stage===0){b=Buffer.concat([b,d]);if(b.length<2)return;if(b[1]!==0)return fail("direct SOCKS auth failed");b=Buffer.alloc(0);stage=1;s.write(Buffer.concat([Buffer.from([5,1,0,1,...ip]),p]));return}if(stage===1){b=Buffer.concat([b,d]);if(b.length<10)return;if(b[1]!==0)return fail("direct SOCKS connect failed");stage=2;s.write("PING");return}body+=d.toString();if(body.includes("POMP NET VLESS E2E OK")){console.log("PASS: direct Xray SOCKS5 baseline returns payload");s.end();process.exit(0)}});s.setTimeout(5000,()=>fail("direct SOCKS5 baseline timed out: "+body));s.on("error",fail)'
          docker exec -e TEST_UUID="$test_uuid" -e TEST_WS_PATH="$test_path" siderail-smoke node -e 'const fs=require("fs");const cfg={log:{loglevel:"debug"},inbounds:[{tag:"client-socks",listen:"127.0.0.1",port:10808,protocol:"socks",settings:{auth:"noauth",udp:false,ip:"127.0.0.1"}}],outbounds:[{tag:"proxy",protocol:"vless",settings:{vnext:[{address:"127.0.0.1",port:8080,users:[{id:process.env.TEST_UUID,encryption:"none"}]}]},streamSettings:{network:"ws",security:"none",wsSettings:{path:process.env.TEST_WS_PATH,headers:{Host:"127.0.0.1:8080"}}}}]};fs.writeFileSync("/tmp/client.json",JSON.stringify(cfg))'
          # Isolate Xray VLESS itself from the Node WebSocket relay.
          docker exec -e TEST_UUID="$test_uuid" -e TEST_WS_PATH="$test_path" siderail-smoke node -e 'const fs=require("fs");const c={log:{loglevel:"warning"},inbounds:[{listen:"127.0.0.1",port:10810,protocol:"socks",settings:{auth:"noauth",udp:false}}],outbounds:[{protocol:"vless",settings:{vnext:[{address:"127.0.0.1",port:20000,users:[{id:process.env.TEST_UUID,encryption:"none"}]}]},streamSettings:{network:"ws",security:"none",wsSettings:{path:process.env.TEST_WS_PATH}}}]};fs.writeFileSync("/tmp/direct-vless-client.json",JSON.stringify(c))'
          docker exec -d siderail-smoke sh -c '/data/core/xray run -config /tmp/direct-vless-client.json >/tmp/direct-vless-client.log 2>&1'
          sleep 2
          docker exec -e TEST_TARGET_IP="$test_target_ip" siderail-smoke node -e 'const net=require("net");const ip=process.env.TEST_TARGET_IP.split(".").map(Number),p=Buffer.alloc(2);p.writeUInt16BE(18090);const s=net.connect(10810,"127.0.0.1");let stage=0,b=Buffer.alloc(0),body="";const fail=e=>{console.error(e);process.exit(3)};s.on("connect",()=>s.write(Buffer.from([5,1,0])));s.on("data",d=>{if(stage===0){b=Buffer.concat([b,d]);if(b.length<2)return;if(b[1]!==0)return fail("direct VLESS SOCKS auth failed");b=Buffer.alloc(0);stage=1;s.write(Buffer.concat([Buffer.from([5,1,0,1,...ip]),p]));return}if(stage===1){b=Buffer.concat([b,d]);if(b.length<10)return;if(b[1]!==0)return fail("direct VLESS SOCKS connect failed");stage=2;s.write("PING");return}body+=d.toString();if(body.includes("POMP NET VLESS E2E OK")){console.log("PASS: direct VLESS-to-Xray inbound returns payload without SideRail HTTP relay");s.end();process.exit(0)}});s.setTimeout(6000,()=>fail("direct VLESS baseline timed out: "+body));s.on("error",fail)' || { echo "=== direct VLESS client log ==="; docker exec siderail-smoke cat /tmp/direct-vless-client.log || true; echo "=== server Xray access ==="; docker exec siderail-smoke cat /data/core/access.log || true; echo "=== echo log ==="; docker exec siderail-smoke cat /tmp/echo.log || true; echo "=== listeners ==="; docker exec siderail-smoke ss -lntp || true; exit 1; }
          docker exec -d siderail-smoke sh -c '/data/core/xray run -config /tmp/client.json >/tmp/client.log 2>&1'
          sleep 2
          docker exec -e TEST_TARGET_IP="$test_target_ip" siderail-smoke node -e 'const net=require("net");const ip=process.env.TEST_TARGET_IP.split(".").map(Number);const port=Buffer.alloc(2);port.writeUInt16BE(18090);const s=net.createConnection({host:"127.0.0.1",port:10808});let stage=0,buf=Buffer.alloc(0),body="";const fail=e=>{console.error(e);s.destroy();process.exit(4)};s.on("connect",()=>s.write(Buffer.from([5,1,0])));s.on("data",d=>{if(stage===0){buf=Buffer.concat([buf,d]);if(buf.length<2)return;if(buf[0]!==5||buf[1]!==0)return fail("SOCKS5 no-auth negotiation failed: "+buf.toString("hex"));buf=Buffer.alloc(0);stage=1;s.write(Buffer.concat([Buffer.from([5,1,0,1,...ip]),port]));return}if(stage===1){buf=Buffer.concat([buf,d]);if(buf.length<10)return;if(buf[0]!==5||buf[1]!==0)return fail("SOCKS5 CONNECT failed: "+buf.toString("hex"));stage=2;s.write("PING");return}body+=d.toString("utf8");if(body.includes("POMP NET VLESS E2E OK")){console.log("PASS: real VLESS client tunnel through SideRail Xray delivered the HTTP echo payload");s.end();process.exit(0)}});s.setTimeout(12000,()=>fail("VLESS SOCKS5 tunnel response timed out; stage="+stage+" body="+body));s.on("error",fail)' || { echo "=== client Xray log ==="; docker exec siderail-smoke cat /tmp/client.log || true; echo "=== echo server log ==="; docker exec siderail-smoke cat /tmp/echo.log || true; echo "=== SideRail Xray access log ==="; docker exec siderail-smoke sh -c 'cat /data/core/access.log 2>/dev/null || true'; echo "=== SideRail Xray error log ==="; docker exec siderail-smoke sh -c 'cat /data/core/error.log 2>/dev/null || true'; echo "=== generated VLESS inbound (secrets redacted) ==="; docker exec siderail-smoke node -e 'const c=require("/data/core/config.json");const x=c.inbounds.find(i=>i.tag==="VLESS-WS");if(x){x.settings.clients=(x.settings.clients||[]).map(u=>({...u,id:"[redacted]"}));console.log(JSON.stringify(x,null,2))}'; echo "=== listeners ==="; docker exec siderail-smoke sh -c 'ss -lntp 2>/dev/null || netstat -lntp 2>/dev/null || true'; docker logs siderail-smoke || true; exit 1; }
          handshake=0
          for i in $(seq 1 60); do
            if docker exec siderail-smoke node -e 'const fs=require("fs"),net=require("net");const c=JSON.parse(fs.readFileSync("/data/core/config.json","utf8"));const tags=["VLESS-WS"];let ix=0;function next(){if(ix===tags.length){console.log("PASS: real SideRail VLESS Xray WS inbound returned HTTP 101");process.exit(0)}const b=c.inbounds.find(x=>x.tag===tags[ix++]);if(!b)process.exit(2);const p=b.streamSettings.wsSettings.path;const s=net.createConnection({host:"127.0.0.1",port:b.port},()=>s.write("GET "+p+" HTTP/1.1\r\nHost: localhost\r\nUpgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==\r\nSec-WebSocket-Version: 13\r\n\r\n"));let d="";s.setTimeout(4000,()=>process.exit(3));s.on("data",x=>{d+=x.toString();if(d.includes("\r\n\r\n")){s.destroy();if(!d.startsWith("HTTP/1.1 101")){console.error(tags[ix-1],d.slice(0,100));process.exit(4)}next()}});s.on("error",()=>process.exit(5))}next()'; then handshake=1; break; fi
            sleep 2
          done
          [ "$handshake" = "1" ] || { echo "SideRail Xray WebSocket handshake failed"; exit 1; }
          docker restart siderail-smoke >/dev/null
          persisted=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18081/healthz >/dev/null && docker exec siderail-smoke test -s /data/siderail.db; then persisted=1; break; fi
            sleep 2
          done
          [ "$persisted" = "1" ] || { echo "SideRail /data database did not persist across container restart"; exit 1; }
          echo "PASS: SideRail API CRUD, persistent /data database, Xray config validation and real VLESS client tunnel and WebSocket handshake."
