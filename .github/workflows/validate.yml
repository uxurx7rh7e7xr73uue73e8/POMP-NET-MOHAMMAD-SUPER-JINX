name: POMP NET SUPER JINX validation

on:
  push:
    branches: [main, restore-official-siderail-main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate legacy maintenance scripts (not used by the SideRail runtime)
        run: |
          bash -n start.sh
          bash -n setup-vps.sh

      - name: Verify the official, unmodified SideRail runtime is selected
        run: |
          python - <<'PY'
          from pathlib import Path
          docker = Path("Dockerfile").read_text(encoding="utf-8")
          railway = Path("railway.json").read_text(encoding="utf-8")
          assert "https://github.com/icubaby/SideRail.git" in docker
          assert "6d794ce2303a01ecc412941a4f38fd00a3bda65b" in docker
          assert "npm run build" in docker
          assert "patch_brand.py" not in docker
          assert "patch_i18n.py" not in docker
          assert "pompnet-theme.css" not in docker
          assert "apps/web/dist ./public" in docker
          assert "upstream/LICENSE ./LICENSE" in docker
          assert "upstream/NOTICE ./NOTICE" in docker
          assert '"healthcheckPath": "/healthz"' in railway
          print("PASS: root runtime builds the pinned upstream SideRail source without UI/brand patches and retains LICENSE/NOTICE.")
          PY

      - name: Validate Python maintenance and migration utilities
        run: |
          python -m py_compile doctor.py enforce_hosts.py ensure_admin.py jinx_api.py lock.py pompnet_telegram_bot.py migration/marzban_to_siderail_backup.py

      - name: Validate JSON and Compose configuration
        run: |
          python -m json.tool railway.json >/dev/null
          python -m json.tool xray_config.json >/dev/null
          python -m json.tool locked_inbound.json >/dev/null
          cp .env.example .env
          docker compose config --quiet
          rm -f .env

      - name: Build official SideRail production image
        run: docker build --pull -t pompnet-super-jinx:ci .

      - name: Runtime validation
        run: echo "Full API, Xray and transport smoke tests are tracked separately; image build alone is not a live deployment."
