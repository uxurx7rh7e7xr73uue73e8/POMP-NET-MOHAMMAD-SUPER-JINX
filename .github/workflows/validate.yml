name: POMP NET SUPER JINX validation

on:
  push:
    branches: [main, restore-official-siderail-main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate legacy maintenance scripts
        run: |
          bash -n start.sh
          bash -n setup-vps.sh

      - name: Verify production runtime, branding patches and HTTPS subscription routing
        run: |
          python - <<'PY'
          from pathlib import Path
          docker = Path("Dockerfile").read_text(encoding="utf-8")
          caddy = Path("Caddyfile").read_text(encoding="utf-8")
          compose = Path("compose.yaml").read_text(encoding="utf-8")
          required_docker = [
              "https://github.com/icubaby/SideRail.git",
              "6d794ce2303a01ecc412941a4f38fd00a3bda65b",
              "pompnet-theme.css",
              "patch_i18n.py",
              "patch_tunnel.py",
              "patch_subscription.py",
              "patch_brand.py",
              "npm run build",
              "apps/server/dist ./apps/server/dist",
              "apps/web/dist ./public",
              "upstream/LICENSE ./LICENSE",
              "upstream/NOTICE ./NOTICE",
          ]
          for item in required_docker:
              assert item in docker, f"Missing production Dockerfile requirement: {item}"
          assert "handle /sub/*" in caddy, "Caddy must preserve and proxy the real /sub/* endpoint"
          assert "reverse_proxy pompnet:8080" in caddy
          assert '"443:443"' in compose, "Public TCP/443 must be published"
          assert 'SIDERAIL_DATA_DIR: /var/lib/marzban/siderail' in compose
          assert 'pompnet_data:/var/lib/marzban' in compose
          print("PASS: pinned SideRail runtime, POMP NET patches, persistent volume and HTTPS/443 subscription route are configured.")
          PY

      - name: Validate Python maintenance, migration and build-patch utilities
        run: |
          python -m py_compile doctor.py enforce_hosts.py ensure_admin.py jinx_api.py lock.py pompnet_telegram_bot.py migration/marzban_to_siderail_backup.py
          python -m py_compile siderail/patch_i18n.py siderail/patch_tunnel.py siderail/patch_subscription.py siderail/patch_brand.py

      - name: Validate JSON and Compose configuration
        run: |
          python -m json.tool railway.json >/dev/null
          python -m json.tool xray_config.json >/dev/null
          python -m json.tool locked_inbound.json >/dev/null
          cp .env.example .env
          docker compose config --quiet
          rm -f .env

      - name: Build production image with POMP NET branding
        run: docker build --pull -t pompnet-super-jinx:ci .

      - name: Runtime validation scope
        run: echo "Image build and configuration checks run here. Live TLS, real user-token subscription and client connectivity must still be verified on the deployed server."
