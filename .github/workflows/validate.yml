name: POMP NET SUPER JINX validation

on:
  push:
    branches: [main, siderail-native-root-runtime]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-siderail:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell and frontend syntax
        run: |
          bash -n start.sh
          node --check pompnet-siderail.js

      - name: Validate native SideRail primary routing
        run: |
          python - <<'PY'
          from pathlib import Path
          nginx = Path("nginx.conf").read_text(encoding="utf-8")
          start = Path("start.sh").read_text(encoding="utf-8")
          docker = Path("Dockerfile").read_text(encoding="utf-8")
          assert 'proxy_pass http://127.0.0.1:8092' in nginx
          assert 'proxy_pass http://127.0.0.1:8000' not in nginx.split('location / {', 1)[1].split('}', 1)[0]
          assert 'proxy_pass http://127.0.0.1:8092' in nginx.split('location ^~ /sub/', 1)[1].split('}', 1)[0]
          assert '/opt/siderail/apps/server/dist/index.js' in start
          assert 'http://127.0.0.1:8092/healthz' in start
          assert 'SIDERAIL_DATA_DIR' in start and 'CORE_DIR' in start
          assert 'COPY --from=siderail-build /build/upstream/apps/server/dist /opt/siderail/apps/server/dist' in docker
          assert 'COPY --from=siderail-build /build/upstream/apps/web/dist /opt/siderail/apps/web/dist' in docker
          assert 'COPY --from=siderail-build /build/upstream/LICENSE /opt/siderail/LICENSE' in docker
          assert 'COPY --from=siderail-build /build/upstream/NOTICE /opt/siderail/NOTICE' in docker
          print("Native SideRail SPA/API runtime, health gate, subscriptions and license artifacts are wired.")
          PY

      - name: Validate Python helpers
        run: |
          python -m py_compile doctor.py enforce_hosts.py ensure_admin.py jinx_api.py lock.py pompnet_telegram_bot.py

      - name: Validate JSON and Docker Compose
        run: |
          python -m json.tool xray_config.json >/dev/null
          python -m json.tool locked_inbound.json >/dev/null
          python -m json.tool railway.json >/dev/null
          cp .env.example .env
          docker compose config --quiet
          rm -f .env

      - name: Build production Docker image
        run: docker build --pull -t pompnet-super-jinx:ci .
