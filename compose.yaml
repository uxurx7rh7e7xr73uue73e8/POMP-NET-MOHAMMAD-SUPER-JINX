name: pompnet-super-jinx

services:
  pompnet:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pompnet-super-jinx
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      PORT: "8080"
      NODE_ENV: production
      SIDERAIL_DATA_DIR: /var/lib/marzban/siderail
      CORE_DIR: /var/lib/marzban/siderail/core
      CORE_VERSION: ${CORE_VERSION:-v26.9.9}
      CORE_API_PORT: ${CORE_API_PORT:-10085}
      CORE_INBOUND_BASE_PORT: ${CORE_INBOUND_BASE_PORT:-20000}
      JWT_SECRET: ${JWT_SECRET:-}
    volumes:
      - pompnet_data:/var/lib/marzban
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 120s

  caddy:
    image: caddy:2
    container_name: pompnet-super-jinx-caddy
    restart: unless-stopped
    depends_on:
      pompnet:
        condition: service_healthy
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN:-panel.example.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pompnet_data:
    name: pompnet_data
  caddy_data:
  caddy_config:
