# POMP NET - isolated PasarGuard core
# This is a parallel deployment. It does NOT replace the existing Marzban service.
# Keep the existing /var/lib/marzban volume untouched until migration acceptance.
services:
  pasarguard:
    image: pasarguard/panel:latest
    container_name: pompnet-pasarguard
    restart: unless-stopped
    env_file:
      - .env
    network_mode: host
    volumes:
      - /var/lib/pasarguard:/var/lib/pasarguard
