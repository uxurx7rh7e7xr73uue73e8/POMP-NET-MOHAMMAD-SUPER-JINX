map $http_upgrade $conn_up { default upgrade; '' close; }
upstream jinx_xhttp { server 127.0.0.1:2006 max_fails=0; keepalive 128; keepalive_requests 100000; keepalive_timeout 300s; }
upstream jinx_sub_gateway { server 127.0.0.1:8090; keepalive 32; }
server {
 listen 8080 reuseport backlog=4096;
 include /etc/nginx/jinx-port.inc;
 tcp_nodelay on; keepalive_requests 100000; keepalive_timeout 300s; absolute_redirect off;
 proxy_buffering off; proxy_request_buffering off;
 location = /health { access_log off; proxy_pass http://127.0.0.1:8000/dashboard/; proxy_set_header Host $host; add_header Cache-Control "no-store" always; }
 location = /sub { return 308 /sub/; }
 location ^~ /sub/ { proxy_pass http://jinx_sub_gateway; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Real-IP $remote_addr; proxy_buffering off; proxy_read_timeout 60s; add_header Cache-Control "no-store" always; }
 # Marzban is the native login, dashboard, users and subscription administration UI.
 location = / { return 302 /dashboard/; }
 location = /panel { return 302 /dashboard/; }
 location = /panel/ { return 302 /dashboard/; }
 location = /dashboard { return 302 /dashboard/; }
 location ^~ /dashboard/ {
   proxy_pass http://127.0.0.1:8000; proxy_http_version 1.1; proxy_set_header Host $host;
   proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
   proxy_set_header Accept-Encoding ""; proxy_read_timeout 1h;
   sub_filter_once on; sub_filter_types text/html;
   sub_filter '</body>' '<script src="/pompnet-siderail.js" defer></script></body>';
 }
 location = /pompnet-siderail.js { alias /opt/jinx/pompnet-siderail.js; default_type application/javascript; add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; }
 location = /jx-status { access_log off; alias /run/jinx/status.json; default_type application/json; charset utf-8; add_header Cache-Control "no-store"; }
 location = /pompnet-motion.css { alias /opt/jinx/pompnet-motion.css; default_type text/css; add_header Cache-Control "no-cache"; }
 location = /pompnet-motion.js { alias /opt/jinx/pompnet-motion.js; default_type application/javascript; add_header Cache-Control "no-cache"; }
 location = /jinx.css { alias /opt/jinx/jinx.css; default_type text/css; add_header Cache-Control "no-cache"; }
 location = /jinx.js { alias /opt/jinx/jinx.js; default_type application/javascript; add_header Cache-Control "no-cache"; }
 location = /agent { return 302 /agent/; }
 location = /agent/ { return 302 /dashboard/; }
 location = /doctor { return 301 /doctor/; }
 location = /doctor/ { root /opt/jinx; try_files /doctor.html =404; default_type text/html; charset utf-8; add_header Cache-Control "no-store" always; add_header X-Content-Type-Options nosniff; add_header Referrer-Policy no-referrer; }
 location = /bot { return 301 /bot/; }
 location = /bot/ { root /opt/jinx; try_files /bot.html =404; default_type text/html; charset utf-8; add_header Cache-Control "no-store" always; add_header X-Content-Type-Options nosniff; add_header Referrer-Policy no-referrer; }
 location = /donate { return 302 /donate/; }
 location = /donate/ { rewrite ^ /donate.html last; }
 location = /donate.html { root /opt/jinx; default_type text/html; charset utf-8; add_header Cache-Control "no-store" always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer; }
 location = /donate/config.js { rewrite ^ /donate-config.js last; }
 location = /donate-config.js { root /opt/jinx; default_type application/javascript; add_header Cache-Control "no-store" always; add_header X-Content-Type-Options nosniff; }
 location /jinx-fonts/ { alias /opt/jinx/fonts/; types { font/woff2 woff2; } add_header Cache-Control "public, max-age=31536000"; }
 # Legacy branded dashboard remains available only as a compatibility page, not the primary UI.
 location = /pompnet { return 302 /pompnet/; }
 location = /pompnet/ { root /opt/jinx; try_files /pompnet-dashboard.html =404; default_type text/html; charset utf-8; add_header Cache-Control "no-store" always; add_header X-Content-Type-Options nosniff always; }
 location = /pompnet-dashboard.html { root /opt/jinx; default_type text/html; charset utf-8; add_header Cache-Control "no-store" always; }
 location = __JXB__ { proxy_pass http://127.0.0.1:2004; include /etc/nginx/ws.inc; }
 location = __JXB__/v { proxy_pass http://127.0.0.1:2001; include /etc/nginx/ws.inc; }
 location = __JXB__/m { proxy_pass http://127.0.0.1:2002; include /etc/nginx/ws.inc; }
 location = __JXB__/t { proxy_pass http://127.0.0.1:2003; include /etc/nginx/ws.inc; }
 location = __JXB__/u { proxy_pass http://127.0.0.1:2005; include /etc/nginx/ws.inc; }
 location __JXB__/x { proxy_pass http://jinx_xhttp; access_log off; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header Connection ""; proxy_buffering off; proxy_request_buffering off; proxy_socket_keepalive on; client_max_body_size 0; client_body_buffer_size 256k; proxy_read_timeout 1d; proxy_send_timeout 1d; }
 include /etc/nginx/jinx-old.inc;
 location /jinx-api/ { proxy_pass http://127.0.0.1:8090; proxy_set_header X-Jinx-Remote $remote_addr; proxy_set_header X-Jinx-Real $http_x_real_ip; proxy_set_header X-Jinx-XFF $http_x_forwarded_for; proxy_set_header X-Jinx-CF $http_cf_connecting_ip; client_max_body_size 26m; add_header Cache-Control "no-store" always; }
 location @gate_down { default_type application/json; add_header Retry-After 3 always; return 503 '{"detail":"سرویس در حال راه‌اندازی دوباره است. چند ثانیه دیگر دوباره امتحان کنید."}'; }
 location @panel_direct { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
 location / { proxy_pass http://127.0.0.1:8000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $conn_up; proxy_read_timeout 1h; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
}